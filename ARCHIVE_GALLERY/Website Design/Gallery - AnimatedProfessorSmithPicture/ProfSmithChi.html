<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outlined Tai Chi Man with Floating Symbol</title>
<style>
  :root {
    --paper: #ead1a3;
    --paper-light: #f4e2bc;
    --paper-dark: rgba(85,55,20,.035);
    --ink: #11100d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 30% 24%, rgba(255,255,255,.13), transparent 30%),
      radial-gradient(circle at 72% 70%, rgba(95,61,21,.055), transparent 38%),
      repeating-radial-gradient(circle at 18% 22%,
        var(--paper-dark) 0 1px,
        transparent 1px 5px),
      linear-gradient(180deg, #efd9af 0%, #e8ca96 100%);
  }

  .art {
    width: min(96vw, 96vh);
    aspect-ratio: 1;
    display: block;
    overflow: visible;
  }

  .man-fill {
    fill: var(--ink);
    fill-rule: evenodd;
    clip-rule: evenodd;
  }

  /* Outline path goes underneath the fill path so the man always reads in front. */
  .man-outline {
    fill: var(--ink);
    fill-rule: evenodd;
    clip-rule: evenodd;
    stroke: var(--paper-light);
    stroke-width: 10;
    stroke-linejoin: round;
    stroke-linecap: round;
    paint-order: stroke fill;
  }

  .symbol-dark {
    fill: var(--ink);
  }

  .symbol-light {
    fill: var(--paper);
  }

  /* Float + spin the symbol BEHIND the man. */
  #symbolFloat {
    transform-box: fill-box;
    transform-origin: center;
    animation:
      floatSymbol 6.8s ease-in-out infinite,
      spinSymbol 16s linear infinite;
    opacity: 0.95;
    will-change: transform;
  }

  /* Man remains clearly in front. */
  #man {
    transform-box: fill-box;
    transform-origin: 50% 72%;
    animation:
      weightShift 5.2s ease-in-out infinite,
      breathing 3.8s ease-in-out infinite;
    will-change: transform;
  }

  @keyframes spinSymbol {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  @keyframes floatSymbol {
    0%, 100% {
      translate: 0px 0px;
      scale: 1;
    }
    25% {
      translate: -8px -8px;
      scale: 1.01;
    }
    50% {
      translate: 0px -18px;
      scale: 1.02;
    }
    75% {
      translate: 8px -8px;
      scale: 1.01;
    }
  }

  @keyframes weightShift {
    0%, 100% { transform: translate3d(0px, 0px, 0px) rotate(0deg); }
    20% { transform: translate3d(-3px, 1px, 0px) rotate(-0.18deg); }
    50% { transform: translate3d(4px, -4px, 0px) rotate(0.28deg); }
    80% { transform: translate3d(2px, 1px, 0px) rotate(0.12deg); }
  }

  @keyframes breathing {
    0%, 100% { scale: 1 1; }
    50% { scale: 1.0025 1.01; }
  }

  @media (prefers-reduced-motion: reduce) {
    #symbolFloat, #man {
      animation: none !important;
    }
  }
</style>
</head>

      <g>
